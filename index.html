<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>A Little Something For You</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main id="app">


    <!-- ======================================
         DECORATIVE KITTENS
         ====================================== -->

    <img
        class="decorative-kitten kitten-one"
        src="assets/grphicpusheen.jpg"
        alt=""
    >

    <img
        class="decorative-kitten kitten-two"
        src="assets/grphicpusheen.jpg"
        alt=""
    >


    <!-- ======================================
         PAGE 1
         ====================================== -->

    <section
        id="page-name"
        class="page active"
    >

        <div class="content-card">

            <h1>
                Enter your name
            </h1>

            <input
                type="text"
                id="nameInput"
                placeholder="Your name..."
                autocomplete="off"
            >

            <button onclick="checkName()">
                Continue
            </button>

            <p id="nameMessage"></p>

        </div>

    </section>


    <!-- ======================================
         PAGE 2
         ====================================== -->

    <section
        id="page-my-name"
        class="page"
    >

        <div class="content-card">

            <h1>
                Kadruuu...
            </h1>

            <p>
                What's my name?
            </p>

            <input
                type="text"
                id="myNameInput"
                placeholder="My name..."
                autocomplete="off"
            >

            <button onclick="checkMyName()">
                Continue
            </button>

            <p id="myNameMessage"></p>

        </div>

    </section>


    <!-- ======================================
         INTRO
         ====================================== -->

    <section
        id="page-intro"
        class="page"
    >

        <div class="content-card">

            <h1>
                Honeybun...
            </h1>

            <p id="introMessage"></p>

            <button onclick="startQuestions()">
                yessss
            </button>

        </div>

    </section>


    <!-- ======================================
         QUESTION 1
         ====================================== -->

    <section
        id="page-question-1"
        class="page"
    >

        <div class="content-card">

            <span class="question-number">
                Question 1 / 3
            </span>

            <h1>
                Do you love me Kadru? :3
            </h1>

            <div class="options">

                <button
                    onclick="answerQuestion1('Yes')"
                >
                    Yes
                </button>

                <button
                    onclick="answerQuestion1('No')"
                >
                    No
                </button>

            </div>

            <p id="question1Message"></p>

            <button
                id="question1Continue"
                class="continue-button"
                onclick="goToQuestion2()"
                style="display: none;"
            >
                Continue
            </button>

        </div>

    </section>


    <!-- ======================================
         QUESTION 2
         ====================================== -->

    <section
        id="page-question-2"
        class="page"
    >

        <div class="content-card">

            <span class="question-number">
                Question 2 / 3
            </span>

            <h1>
                If you could have any one of these,
                which one will you pick?
            </h1>

            <div class="options">

                <button
                    onclick="answerQuestion2(
                        'All of the Pusheen merch'
                    )"
                >
                    All of the Pusheen merch
                </button>


                <button
                    onclick="answerQuestion2(
                        'As many kittens as you can have'
                    )"
                >
                    As many kittens as you can have
                </button>


                <button
                    onclick="answerQuestion2(
                        'Become a kitten yourself'
                    )"
                >
                    Become a kitten yourself
                </button>

            </div>

            <p id="question2Message"></p>

            <button
                id="question2Continue"
                class="continue-button"
                onclick="goToQuestion3()"
                style="display: none;"
            >
                Continue
            </button>

        </div>

    </section>


    <!-- ======================================
         QUESTION 3
         ====================================== -->

    <section
        id="page-question-3"
        class="page"
    >

        <div class="content-card final-question">

            <span class="question-number">
                Question 3 / 3
            </span>

            <h1>
                Will you be my girlfriend... :3
            </h1>

            <div id="finalOptions">

                <button
                    onclick="answerQuestion3('Yes')"
                >
                    Yes
                </button>


                <button
                    id="noButton"
                    onclick="handleNo()"
                >
                    No
                </button>

            </div>

            <p id="question3Message"></p>

        </div>

    </section>


    <!-- ======================================
         FINAL PAGE
         ====================================== -->

    <section
        id="page-final"
        class="page"
    >

        <div class="content-card">

            <h1 id="finalMessage"></h1>

        </div>

    </section>


</main>


<script src="script.js"></script>

</body>

</html>
